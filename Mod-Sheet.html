</main><footer><span data-ja="入力内容は外部に送信されません。再読み込みすると作業内容は消えます。" data-en="Your list stays on this device. Reloading clears your work."></span><span data-ja="保存するのは言語とテーマの設定だけです。" data-en="Only language and theme preferences are saved."></span></footer>

(function (root) {
  const { catalog } = typeof module !== 'undefined' ? require('./catalog.js') : root.ModCatalog;
  const normalize = value => value.normalize('NFKC').toLowerCase().replace(/\s+/g, '');
  const aliases = new Map(catalog.flatMap(item => item.labels.map(label => [normalize(label), item.id])));
  const colors = new Map(Object.entries({ 'メインカラー': 'Primary Color', 'サブカラー': 'Secondary Color', 'パール': 'Pearlescent Color', 'ホイール': 'Wheel Rim Color', '内装': 'Interior Color' }));

  function parse(text) {
    const entries = [];
    const unread = [];
    // Brackets define each value, so commas inside a value are preserved.
    const pattern = /([^,，;；\r\n\[\]]+?)\s*[-–—]\s*\[([^\[\]]*)\]/gu;
    let end = 0;
    const keepUnread = value => { const clean = value.replace(/^[\s,，;；]+|[\s,，;；]+$/g, ''); if (clean) unread.push(clean); };
    for (const match of text.matchAll(pattern)) {
      keepUnread(text.slice(end, match.index));
      end = match.index + match[0].length;
      const label = match[1].trim();
      const value = match[2].trim();
      const numbered = value.match(/^(-?\d+)\s*\.\s*([\s\S]*)$/);
      let itemId = aliases.get(normalize(label)) || null;
      const warnings = [];
      let suggestion = null;
      if (['スピーカー', 'speaker', 'speakers'].includes(normalize(label))) {
        suggestion = 'interior';
        warnings.push('The reference lists Door Speakers under Interior Parts, not this exact category. Confirm the item before counting it.');
      }
      if (/HSW/i.test(value) && ['スピーカー', 'speaker', 'speakers', 'ドアスピーカー', 'doorspeakers'].includes(normalize(label))) {
        suggestion = 'interior';
        itemId = null;
        warnings.push('The category says Speaker, but the option names an HSW performance upgrade. Check the original vehicle menu.');
      }
      if (normalize(label) === 'スパーク' || normalize(label) === 'spark') warnings.push('“スパーク” appears in the reference, but its meaning is uncertain.');
      if (!value || (numbered && !numbered[2].trim())) warnings.push('This entry has an empty option name. Check the export before applying it.');
      entries.push({ label, value, optionNumber: numbered ? numbered[1] : null, optionName: numbered ? numbered[2].trim() : value, itemId, suggestion, warnings, colorName: colors.get(label) || null });
    }
    keepUnread(text.slice(end));
    return { entries, unread };
  }

  function counts(entries) {
    const totals = new Map();
    for (const entry of entries) if (entry.itemId) totals.set(entry.itemId, (totals.get(entry.itemId) || 0) + 1);
    return catalog.filter(item => totals.has(item.id)).map(item => ({ ...item, quantity: totals.get(item.id) }));
  }
  root.ModParser = { parse, counts };
  if (typeof module !== 'undefined') module.exports = root.ModParser;
})(globalThis);

const warningsJa = {
  'The reference lists Door Speakers under Interior Parts, not this exact category. Confirm the item before counting it.': '資料では「ドアスピーカー」が内装パーツに含まれています。「スピーカー」と同じ項目か確認してから、アイテムを指定してください。',
  'The category says Speaker, but the option names an HSW performance upgrade. Check the original vehicle menu.': '項目名はスピーカーですが、設定値はHSW性能アップグレードです。ゲーム内の車両メニューで確認してください。',
  '“スパーク” appears in the reference, but its meaning is uncertain.': '「スパーク」は資料に記載されていますが、具体的な内容は未確認です。',
  'This entry has an empty option name. Check the export before applying it.': '設定名が空欄です。適用する前に元のカスタム一覧を確認してください。'
};
const notesJa = {
  paint: 'メインカラー・サブカラー・パール・ホイール・内装・ダッシュボードの色変更に使用します。ダッシュボードは内装パーツではなく、カラー缶として数えます。',
  smoke: 'タイヤから出る煙の色を変更。RGB調整に対応。資料のアイテム名は途中で切れているため、用途に基づく仮称と別名を使用しています。',
  interior: '「スパーク」は資料の表記をそのまま転記しており、意味は未確認です。「スピーカー」は候補として表示します。',
  horn: 'クラクションの変更用。資料内のクラクション一覧リンクの内容は含まれていません。',
  wheels: 'リムの種類を変更するアイテムです。リムの色は対象外です。資料によるとホイールごとに多少の性能差があります。リンク先の一覧は未収録です。',
  neon: '装着後、車内でネオンコントローラーを使用して色を変更します。RGB調整に対応。',
  headlights: '装着後、車内でネオンコントローラーを使用して色を変更します。RGB調整に対応。資料のアイテム名が途中で切れているため、用途に基づく仮称と別名を使用しています。',
  tint: 'ウィンドウの色・スモークを変更します。「ウィンドウの色合い」は提供されたカスタム一覧の表記です。'
};
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function fitSource() {
  const box = $('source');
  box.style.height = 'auto';
  box.style.height = box.scrollHeight + 2 + 'px';
}
function announce(ja, en) { message = [ja, en]; $('status').textContent = t(...message); }
function preference(key, value) { try { localStorage.setItem('mod-sheet-share-' + key, value); } catch {} }
function renderTheme() {
  document.documentElement.dataset.theme = theme;
  $('theme').setAttribute('aria-pressed', theme === 'dark');
}
function renderParts() {
  const groups = counts(sheet.entries);
  $('parts').replaceChildren();
  for (const item of groups) {
    const row = el('label', 'part');
    const check = el('input');
    check.type = 'checkbox';
    check.checked = gathered.has(item.id);
    row.classList.toggle('done', check.checked);
    check.addEventListener('change', () => {
      check.checked ? gathered.add(item.id) : gathered.delete(item.id);
      row.classList.toggle('done', check.checked);
    });
    const name = el('span', 'part-name');
    name.append(el('strong', '', itemName(item)));
    if (language === 'en') name.append(el('span', 'sub-name', itemJa(item)));
    row.append(check, name, el('span', 'qty', '×' + item.quantity));
    $('parts').append(row);
  }
  const total = groups.reduce((sum, group) => sum + group.quantity, 0);
  const pending = sheet.entries.filter(entry => !entry.itemId).length;
  $('total').textContent = t(`${total} 個`, `${total} items`);
  $('summary').textContent = t(`${sheet.entries.length} 項目 ／ アイテム ${groups.length} 種類 ／ 未指定 ${pending} 項目`, `${sheet.entries.length} customizations / ${groups.length} item types / ${pending} unassigned`);
  $('pending').textContent = pending ? t(`未指定の${pending}項目は個数に含めていません。作業リストで確認してください。`, `${pending} unassigned entries are excluded from quantities. Review them in the fitting guide.`) : t('すべての項目にアイテムが指定されています。', 'All entries have an assigned item.');
  if (!groups.length) $('parts').append(el('p', 'hint', t('該当するアイテムがありません。作業リストで内容を確認してください。', 'No items assigned yet. Review the fitting guide.')));
}
function updateProgress() { $('progress').textContent = t(`${applied.size} / ${sheet.entries.length} 完了`, `${applied.size} / ${sheet.entries.length} applied`); }
function renderGuide() {
  $('guide').replaceChildren();
  sheet.entries.forEach((entry, index) => {
    const row = el('article', 'entry');
    row.classList.toggle('done', applied.has(index));
    const line = el('label', 'entry-line');
    const check = el('input');
    check.type = 'checkbox';
    check.checked = applied.has(index);
    check.setAttribute('aria-label', t(`${entry.label}を適用済みにする`, `Mark ${entry.label} as applied`));
    check.addEventListener('change', () => { check.checked ? applied.add(index) : applied.delete(index); row.classList.toggle('done', check.checked); updateProgress(); });
    const text = el('span', 'entry-text');
    text.append(el('strong', 'category', entry.label), document.createTextNode(' — '), el('span', 'value', `[${entry.value}]`));
    line.append(check, text);
    const detail = el('div', 'entry-detail');
    const item = catalog.find(item => item.id === entry.itemId);
    detail.append(el('p', '', item ? t(`${entry.overridden ? '指定したアイテム' : '必要アイテム'}：${itemName(item)}`, `${entry.overridden ? 'Assigned' : 'Item'}: ${itemName(item)}`) : entry.suggestion ? t('未指定：候補の確認が必要です。', 'Unassigned: suggested match needs confirmation.') : t('未指定：資料に対応アイテムの記載がありません。', `${entry.colorName || 'Unassigned'}: item not specified in the reference.`)));
    if (entry.optionName.toUpperCase() === 'NULL') detail.append(el('p', '', t(`設定名はNULLです${entry.optionNumber !== null ? `（選択肢 ${entry.optionNumber}）` : ''}。元の表記を保持しています。`, `The option name is NULL${entry.optionNumber !== null ? ` (option ${entry.optionNumber})` : ''}. Kept as supplied.`)));
    for (const warning of entry.warnings) detail.append(el('p', 'warning', t('要確認：' + warningsJa[warning], 'Review: ' + warning)));
    if (!entry.itemId || entry.overridden) {
      const label = el('label', 'assignment', t('アイテムを指定', 'Assign inventory item'));
      const select = el('select');
      select.setAttribute('aria-label', t(`${entry.label}のアイテムを指定`, `Assign inventory item for ${entry.label}`));
      const blank = el('option', '', t('未指定のままにする', 'Leave unassigned'));
      blank.value = '';
      select.append(blank);
      for (const item of catalog) {
        const option = el('option', '', itemName(item) + (item.id === entry.suggestion ? t('（候補）', ' (suggested)') : ''));
        option.value = item.id;
        select.append(option);
      }
      select.value = entry.itemId || '';
      select.addEventListener('change', () => {
        gathered.delete(entry.itemId);
        gathered.delete(select.value);
        entry.itemId = select.value || null;
        entry.overridden = true;
        renderParts();
        renderGuide();
        $('guide').children[index].querySelector('select').focus();
        announce(`${entry.label}のアイテムを変更し、必要数を更新しました。`, `Updated the item for ${entry.label} and recalculated quantities.`);
        $('manual-copy').hidden = true;
      });
      label.append(select);
      detail.append(label);
    }
    row.append(line, detail);
    $('guide').append(row);
  });
  updateProgress();
}
function renderUnread() {
  $('unread').hidden = !sheet.unread.length;
  $('unread').replaceChildren();
  if (!sheet.unread.length) return;
  $('unread').append(el('strong', '', t('読み取れなかった部分があります。以下の内容は必要数に含めていません。', 'Some text could not be read. It is excluded from quantities.')));
  for (const text of sheet.unread) $('unread').append(el('pre', '', text));
  $('unread').append(el('p', '', t('「項目名 - [設定値]」の形式に直し、リストを再作成してください。', 'Use Category - [option], then rebuild the sheet.')));
}
function renderCatalog() {
  $('catalog').replaceChildren();
  for (const item of catalog) {
    const row = el('tr');
    const name = el('th', '', itemName(item));
    name.scope = 'row';
    if (language === 'en') name.append(el('span', 'sub-name', itemJa(item)));
    row.append(name, el('td', '', item.labels.join(' / ')), el('td', '', t(notesJa[item.id] || '記載された項目に対応します。英語表記も別名として認識します。', item.note || 'Matches the listed categories. English labels are supported aliases.')));
    $('catalog').append(row);
  }
}
function renderLanguage() {
  document.documentElement.lang = language;
  document.title = t('Mod Sheet — カスタム準備ノート', 'Mod Sheet — FiveM parts planner');
  $('language').value = language;
  document.querySelectorAll('[data-ja]').forEach(node => { node.textContent = node.dataset[language]; });
  $('status').textContent = t(...message);
  renderParts();
  renderGuide();
  renderUnread();
  renderCatalog();
  if (!$('manual-copy').hidden) $('copy-text').value = exportText();
}
function build() {
  builtText = $('source').value;
  sheet = parse(builtText);
  gathered.clear();
  applied.clear();
  $('results').hidden = !sheet.entries.length && !sheet.unread.length;
  $('empty').hidden = !$('results').hidden;
  $('stale').hidden = true;
  $('copy').disabled = false;
  $('manual-copy').hidden = true;
  renderParts();
  renderGuide();
  renderUnread();
  announce(builtText.trim() ? `${sheet.entries.length}項目を読み取りました。${sheet.unread.length ? '読み取れなかった部分を確認してください。' : ''}` : 'カスタム一覧を貼り付けてください。', builtText.trim() ? `Read ${sheet.entries.length} entries.${sheet.unread.length ? ' Review unread text below.' : ''}` : 'Paste your customization list to get started.');
}
function exportText() {
  const lines = ['Mod Sheet', '', t('準備するアイテム（1項目につき1個）', 'Parts to prepare (one item per assigned customization)')];
  for (const item of counts(sheet.entries)) lines.push(`${gathered.has(item.id) ? '[x]' : '[ ]'} ${item.quantity} × ${itemName(item)}`);
  lines.push('', t('取り付け・設定リスト', 'Fitting guide'));
  sheet.entries.forEach((entry, index) => {
    const item = catalog.find(item => item.id === entry.itemId);
    lines.push(`${applied.has(index) ? '[x]' : '[ ]'} ${entry.label} - [${entry.value}] → ${item ? itemName(item) : t('未指定（必要数に含めていません）', 'UNASSIGNED (excluded from quantities)')}`);
    for (const warning of entry.warnings) lines.push(t('  要確認：' + warningsJa[warning], '  Review: ' + warning));
  });
  if (sheet.unread.length) lines.push('', t('読み取れなかった内容（必要数の対象外）', 'Unread text (excluded from quantities)'), ...sheet.unread);
  return lines.join('\n');
}
$('language').addEventListener('change', () => { language = $('language').value; preference('language', language); renderLanguage(); });
$('theme').addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; preference('theme', theme); renderTheme(); });
$('build').addEventListener('click', build);
$('sample').addEventListener('click', () => { $('source').value = sample; fitSource(); build(); });
$('clear').addEventListener('click', () => { $('source').value = ''; fitSource(); build(); $('source').focus(); });
$('source').addEventListener('input', () => { fitSource(); const stale = $('source').value !== builtText; $('stale').hidden = !stale; $('copy').disabled = stale; $('manual-copy').hidden = true; });
$('copy').addEventListener('click', async () => {
  const text = exportText();
  try {
    await navigator.clipboard.writeText(text);
    announce('必要数と確認事項を含めてコピーしました。', 'Copied quantities, fitting steps, and review notes.');
  } catch {
    $('manual-copy').hidden = false;
    $('copy-text').value = text;
    $('copy-text').focus();
    $('copy-text').select();
    announce('下のコピー用テキストを選択してコピーしてください。', 'Select and copy the prepared text below.');
  }
});
renderTheme();
renderLanguage();
fitSource();
window.addEventListener('resize', fitSource);
</script>
</body></html>
